onboarding = false
[theme]
name = "terminal"
auto_switch = false

# Палитра и роли: ~/.config/palette/PALETTE.md
# accent   — обводка активной панели: базовый цвет текста
# overlay0 — обводка неактивных панелей: коричнево-серый
[theme.custom]
panel_bg = "reset"          # прозрачный фон, наследует терминал

accent = "#d4be98"          # fg0 — активная область
overlay0 = "#7c6f64"        # grey0 — неактивное, вспомогательное
overlay1 = "#928374"        # grey1 — метаданные
text = "#d4be98"            # fg0 — обычный текст
subtext0 = "#928374"        # grey1 — второстепенный текст

surface_dim = "#32302f"     # bg0
surface0 = "#3c3836"        # bg1
surface1 = "#504945"        # bg3 — выделение

red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
peach = "#e78a4e"           # orange — фокус
mauve = "#d3869b"           # purple — константы
blue = "#7daea3"            # только ссылки
teal = "#89b482"            # sage

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
accent = "#d4be98"

sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

# agent_panel_sort = "spaces"

status_indicators = "symbols"
[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
row_gap = 1
rows = [["state_icon", "workspace", "tab"], ["pane", "agent"]]

[keys]
prefix = "ctrl+a"
# --- панели ---
close_pane = "prefix+w"
resize_mode = "prefix+x"
copy_mode = "prefix+c"
rename_pane = "prefix+shift+r"

# --- табы ---
new_tab = ["prefix+n", "prefix+shift+t"]
rename_tab = "prefix+shift+n"            # было prefix+shift+t — освободилось под new_tab
close_tab = "prefix+shift+w"
previous_tab = "prefix+["
next_tab = "prefix+]"
switch_tab = ""                          # цифры теперь переключают space, не таб

# --- spaces (workspaces) ---
new_workspace = "prefix+t"
rename_workspace = "prefix+r"
workspace_picker = "prefix+p"    # было prefix+w — освободилось под close_pane
switch_workspace = "prefix+1..9"
previous_workspace = "prefix+{"
next_workspace = "prefix+}"

# --- агенты ---
previous_agent = "prefix+("
next_agent = "prefix+)"

# перенесено из-за коллизии с новым rename_pane (prefix+shift+r)
reload_config = "prefix+shift+c"

[experimental]
pane_history = true
