# Gruvbox Material Alabaster — ghostty
# Источник: ~/.config/palette/PALETTE.md
#
# Отличия от прежнего gruvbox_dark.conf:
#   - фон #282828 -> #3c3836 (bg1): прежний был заметно темнее helix и при
#     background-opacity 0.8 проваливался в чёрный
#   - текст #ebdbb2 -> #d4be98 (fg0): тот же, что в helix
#   - слот 4 (blue) #458588 -> #a89984 (grey2): раньше здесь был пурпурный
#     под каталоги eza/ls, но eza красит директории явным RGB через
#     EZA_COLORS (~/.config/eza/colors.sh) и в ANSI-слоте не нуждается —
#     а пурпурный слот "просвечивал" фиолетовым во всех приложениях,
#     рисующих обычным ANSI-синим (включая Claude Code)
#   - слот 6 (cyan)  #fbf1c7 -> #89b482: шалфейный, а не почти-белый
#   - слот 12 больше не розово-лиловый, слот 14 не сине-голубой
#   - курсор #e78a4e -> #d4be98: стандартный бежевый, не акцентный оранжевый

background = #3c3836
foreground = #d4be98

selection-background = #504945
selection-foreground = #d4be98

cursor-color = #d4be98
cursor-text = #32302f

# ANSI 0-7
palette = 0=#32302f
palette = 1=#cc241d
palette = 2=#98971a
palette = 3=#d8a657
palette = 4=#a89984
palette = 5=#b27085
palette = 6=#89b482
palette = 7=#d4be98

# ANSI 8-15
palette = 8=#7c6f64
palette = 9=#cc241d
palette = 10=#b8bb26
palette = 11=#e3ba6f
palette = 12=#bdae93
palette = 13=#c98a9c
palette = 14=#a3c49d
# bright white = fg1, а НЕ base07 #f9f5d7. Многие CLI печатают bright white
# (SGR 97 или bold+white) обычный текст и заголовки; с #f9f5d7 он читался
# как ярко-белый и выбивался из тёплой палитры. #ddc7a1 — это «белее
# базового, но не полностью белый» по правилу палитры.
palette = 15=#ddc7a1
