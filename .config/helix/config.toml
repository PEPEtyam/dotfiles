theme = "alabaster_gruvbox_material_dark_soft"
# theme = "kanagawa_lotus"
# theme = "gruvbox_material_dark_soft"
# theme = "alabaster_gruvbox_2"
# theme = "kanabox"
# theme = "rusty_colors"

[editor]
line-number = "relative"
cursorline = false
color-modes = true
# rulers = [80]
true-color = true
mouse = true
scrolloff = 10
# gutters = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]
preview-completion-insert = true
popup-border = "all"

[editor.auto-save]
focus-lost = true
after-delay.enable = true
after-delay.timeout = 1000

[editor.indent-guides]
render = true
character = "▏"
# character = "▏"
skip-levels = 0

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
# parents = false
git-ignore = false

[editor.lsp]
auto-signature-help = true
enable = true
display-progress-messages = true
display-messages = true
display-inlay-hints = true
display-signature-help-docs = true

[editor.statusline]
left = [
  "mode",
  "spinner",
  "spacer",
  "file-name",
  "spacer",
  "read-only-indicator",
  "file-modification-indicator"
]
right = [
  "diagnostics",
  "spacer",
  "position-percentage",
  "spacer",
  "position",
  "spacer",
  "file-encoding",
  "spacer",
  # "separator",
  "version-control",
  # "spacer",
]
# separator = ""
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.smart-tab]
enable = true

[editor.inline-diagnostics]
cursor-line = "hint"

[keys.normal]
C-s = ":write"
Cmd-r = ":reload-all"
C-q = ":quit"
A-j = "save_selection"
C-f = ":sh bash -c 'echo -n %{buffer_name} | pbcopy'"
C-backspace = ":reset-diff-change"
A-w = ":buffer-close"
A-f = "@maf<A-;>;2wb"
# A-t — переход к имени класса/типа (аналог A-f, но textobject 't' = type/class)
A-t = "@mat<A-;>;2wb"
# A-c — переход к первому "identifier(" в текущей строке (курсор в любом месте
# строки): x выделяет строку, s ищет по regex внутри выделения (первое
# совпадение слева всегда становится primary — так работает select_regex),
# затем flip+collapse ставит курсор на начало имени.
A-c = "@xs[A-Za-z_][A-Za-z0-9_]*\\(<ret><A-;>;"
E = "goto_line_end"
B = "goto_line_start"
tab = ":buffer-next"
S-tab = ":buffer-previous"
C-h = "jump_view_left"
C-l = "jump_view_right"
C-j = "jump_view_down"
C-k = "jump_view_up"
y = "yank_main_selection_to_clipboard"
p = "paste_clipboard_after"
P = "paste_clipboard_before"
R = "replace_selections_with_clipboard"
X = "extend_line_above"

[keys.normal.g]
# g+b — git blame текущей строки: коммит (название/дата/автор), который её
# последний раз менял, + файлы и строки, изменённые в этом коммите.
b = ":sh ~/.config/helix/bin/hx-blame-info %{cursor_line} \"%{buffer_name}\""

[keys.select]
Cmd-r = ":reload-all"
tab = "expand_selection"
S-tab = "shrink_selection"
E = "goto_line_end"
B = "goto_line_start"
C-space = "normal_mode"
C-c = "normal_mode"
y = "yank_main_selection_to_clipboard"
p = "paste_clipboard_before"
R = "replace_selections_with_clipboard"
X = "extend_line_above"

[keys.insert]
C-s = ":write"
Cmd-r = ":reload-all"
C-c = "normal_mode"
C-e = "goto_line_end"
C-l = "move_char_right"
