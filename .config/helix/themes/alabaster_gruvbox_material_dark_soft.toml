# Alabaster-inspired theme with Gruvbox Material Dark Soft palette
# Minimalist approach: colors for meaningful information only

# Syntax highlighting - minimal but informative
"type" = "red"                         # Структуры/типы - оранжевый для выделения
"constant" = "purple"                  # Константы
"constant.numeric" = "purple"          # Числа
"constant.character.escape" = "fg0"    # Escape-последовательности - без выделения
"string" = "green"                     # Строки - зеленый (как в Alabaster)
"string.regexp" = "green"              # Регулярные выражения - тоже зеленый
"comment" = "grey0"                    # Комментарии - желтый для заметности
"comment.block" = "yellow"
"comment.documentation" = "yellow"
"string.docstring" = "yellow"
"string.documentation" = "yellow"    # Питоновские """...""" — через runtime/queries/python
"comment.line.documentation" = "yellow"
"comment.block.documentation" = "yellow"
"variable" = "fg0"                     # Переменные - обычный текст
"variable.builtin" = "fg0"             # Встроенные переменные - без выделения
"variable.parameter" = "beige_attr"    # Параметры (объявление + использование) - песочно-тусклый, отличается от серого инлей-хинта
"variable.other.member" = "fg0"        # Поля объектов - обычный текст
"label" = "fg0"                        # Метки - обычный текст
"punctuation" = "grey2"                # Пунктуация - серый
"punctuation.delimiter" = "grey2"      # Разделители
"punctuation.bracket" = "fg0"          # Скобки - обычный текст для читаемости
# "keyword" = "grey1"                    # Ключевые слова - легкое выделение серым
# "keyword.directive" = "grey1"          # Директивы
"keyword" = "fg0"                      # Ключевые слова - легкое выделение серым  
"keyword.directive" = "fg0"            # Директивы  
"operator" = "fg0"                     # Операторы - обычный текст
# "function" = "red"                     # Функции/методы - темно-синий
# "function" = {fg = "fg0", modifiers = ["bold"]}                     # Функции/методы - темно-синий
"function" = "orange"
"function.builtin" = "orange"          # Встроенные функции - тоже синий
"function.macro" = "orange_light"      # Макросы (println!) - светлее обычных функций
"tag" = "orange"                       # HTML/XML теги - оранжевый
"namespace" = "fg0"                    # Пространства имен - обычный текст (было red, дублировало "type")
"attribute" = "fg0"                    # Атрибуты - обычный текст
"constructor" = "red"                  # Конструкторы - как "type" (тот же класс, та же роль → тот же цвет)
"module" = "fg0"                       # Модули - обычный текст
"special" = "#98971a"                  # Аннотации/спецэлементы + подсветка совпадений в picker (ohmyposh green, темнее helix-зелёного)

# Markdown - минимальное оформление
"markup.heading.marker" = "grey2"
"markup.heading.1" = { fg = "red", modifiers = ["bold"] }
"markup.heading.2" = { fg = "orange", modifiers = ["bold"] }
"markup.heading.3" = { fg = "yellow", modifiers = ["bold"] }
"markup.heading.4" = { fg = "green", modifiers = ["bold"] }
"markup.heading.5" = { fg = "fg0", modifiers = ["bold"] }
"markup.heading.6" = { fg = "fg0", modifiers = ["bold"] }
"markup.list" = "fg0"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.link.url" = { fg = "blue", modifiers = ["underlined"] }   # голубой ТОЛЬКО здесь
"markup.link.label" = "blue"                                      # сноски
"markup.link.text" = "fg0"
"markup.quote" = "grey2"
"markup.raw" = "green"

# Diff
"diff.plus" = "green"
"diff.delta" = "yellow"
"diff.minus" = "red"

# UI - сохраняем вашу конфигурацию
"ui.background" = {}
"ui.background.separator" = "grey0"
"ui.cursor" = { fg = "bg0", bg = "fg0" }
"ui.cursor.match" = { fg = "orange", bg = "bg_visual_yellow" }
"ui.cursor.insert" = { fg = "bg0", bg = "grey2" }
"ui.cursor.select" = { fg = "bg0", bg = "orange" }
"ui.cursorline.primary" = { bg = "bg1" }
"ui.cursorline.secondary" = { bg = "bg1" }
"ui.selection" = { bg = "bg3" }
"ui.linenr" = "grey0"
"ui.linenr.selected" = { fg = "fg0", modifiers = ["bold"] }
"ui.statusline" = { fg = "fg0", bg = "bg1" }
"ui.statusline.inactive" = { fg = "grey0", bg = "bg0" }
"ui.statusline.normal" = { fg = "bg0", bg = "fg0", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "bg0", bg = "yellow", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "bg0", bg = "orange", modifiers = ["bold"] }
"ui.bufferline" = { fg = "grey0", bg = "bg1" }
"ui.bufferline.active" = { fg = "fg0", bg = "bg3", modifiers = ["bold"] }
"ui.popup" = { fg = "grey2" }
"ui.window" = { fg = "grey0" }
"ui.help" = { fg = "fg0" }
"ui.text" = "fg0"
"ui.text.focus" = "fg0"
"ui.menu" = { fg = "fg0" }
"ui.menu.selected" = { fg = "bg0", bg = "fg1", modifiers = ["bold"]  }
"ui.virtual.whitespace" = { fg = "bg4" }
"ui.virtual.indent-guide" = { fg = "bg4" }
"ui.virtual.inlay-hint" = { fg = "grey0", modifiers = ["italic"]}
"ui.virtual.inlay-hint.parameter" = { fg = "grey0", modifiers = ["italic"] }
"ui.virtual.inlay-hint.type" = { fg = "grey0" }
"ui.virtual.ruler" = { bg = "bg0" }

# Diagnostics
"hint" = "bg_purple"
"info" = "bg_yellow"
"warning" = "bg_orange"
"error" = "bg_red"
"diagnostic" = { underline = { style = "curl" } }
"diagnostic.hint" = { underline = { color = "bg_purple", style = "curl" } }
"diagnostic.info" = { underline = { color = "bg_yellow", style = "curl" } }
"diagnostic.warning" = { underline = { color = "bg_orange", style = "curl" } }
"diagnostic.error" = { underline = { color = "bg_red", style = "curl" } }

