# Keep history and search strictly local to this Mac.
auto_sync = false
update_check = false

# Ctrl-R searches commands containing the typed text on this host.
search_mode = "fulltext"
filter_mode = "host"
style = "auto"
inline_height = 15
show_preview = true
max_preview_height = 8
show_tabs = false
enter_accept = true

[search]
filters = ["host", "directory", "session"]

