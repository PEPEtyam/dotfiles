##############################################
#                                            #
#       Gruvbox Material Alabaster           #
#                                            #
##############################################

# Палитра и семантические роли: ~/.config/palette/PALETTE.md
#
# Принцип: alabaster-минимализм. Цвет несёт информацию, всё остальное —
# базового цвета #d4be98. Обводка активной панели — базовый цвет,
# неактивной — коричнево-серый #7c6f64. Голубого нет.

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Ближайший к палитре стиль chroma. Своих тем chroma здесь не принимает,
# поэтому подсветка превью чуть ярче, чем в bat/helix.
code_syntax_highlight = "gruvbox"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#d4be98"
full_screen_bg = "#32302f"

#-- Gradient
# Только тёплая пара, без контрастного скачка.
gradient_color = ["#e78a4e", "#d8a657"]

#-- File Panel
file_panel_fg = "#d4be98"
file_panel_bg = "#32302f"
file_panel_border = "#7c6f64"           # неактивная панель — коричнево-серый
file_panel_border_active = "#d4be98"    # активная панель — базовый цвет
file_panel_top_directory_icon = "#e78a4e"
file_panel_top_path = "#ddc7a1"         # текущий путь — главное слово
file_panel_item_selected_fg = "#ddc7a1"
file_panel_item_selected_bg = "#504945" # как выделение в helix

#-- Footer
footer_fg = "#d4be98"
footer_bg = "#32302f"
footer_border = "#7c6f64"
footer_border_active = "#d4be98"

#-- Sidebar
sidebar_fg = "#d4be98"
sidebar_bg = "#32302f"
sidebar_title = "#e78a4e"
sidebar_border = "#7c6f64"
sidebar_border_active = "#d4be98"
sidebar_item_selected_fg = "#ddc7a1"
sidebar_item_selected_bg = "#504945"
sidebar_divider = "#504945"

#-- Modals
modal_fg = "#d4be98"
modal_bg = "#32302f"
modal_border_active = "#d4be98"
modal_cancel_fg = "#32302f"
modal_cancel_bg = "#7c6f64"
modal_confirm_fg = "#32302f"
modal_confirm_bg = "#a9b665"

#-- Help Menu
help_menu_hotkey = "#e78a4e"
help_menu_title = "#ddc7a1"

#-- Special
cursor = "#e78a4e"
correct = "#a9b665"
error = "#ea6962"
hint = "#7c6f64"
cancel = "#7c6f64"
